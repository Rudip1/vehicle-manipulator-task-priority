# ros_gz_bridge: Gazebo topics <-> ROS 2 topics.
- {ros_topic_name: /clock, gz_topic_name: /clock, ros_type_name: rosgraph_msgs/msg/Clock, gz_type_name: gz.msgs.Clock, direction: GZ_TO_ROS}
- {ros_topic_name: /cmd_vel, gz_topic_name: /cmd_vel, ros_type_name: geometry_msgs/msg/Twist, gz_type_name: gz.msgs.Twist, direction: ROS_TO_GZ}
- {ros_topic_name: /odom, gz_topic_name: /odom, ros_type_name: nav_msgs/msg/Odometry, gz_type_name: gz.msgs.Odometry, direction: GZ_TO_ROS}
- {ros_topic_name: /tf, gz_topic_name: /tf, ros_type_name: tf2_msgs/msg/TFMessage, gz_type_name: gz.msgs.Pose_V, direction: GZ_TO_ROS}
- {ros_topic_name: /joint_states, gz_topic_name: /joint_states, ros_type_name: sensor_msgs/msg/JointState, gz_type_name: gz.msgs.Model, direction: GZ_TO_ROS}
- {ros_topic_name: /ground_truth/odometry, gz_topic_name: /ground_truth/odometry, ros_type_name: nav_msgs/msg/Odometry, gz_type_name: gz.msgs.Odometry, direction: GZ_TO_ROS}
- {ros_topic_name: /camera/image, gz_topic_name: /camera/image, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
- {ros_topic_name: /camera/camera_info, gz_topic_name: /camera/camera_info, ros_type_name: sensor_msgs/msg/CameraInfo, gz_type_name: gz.msgs.CameraInfo, direction: GZ_TO_ROS}
- {ros_topic_name: /arm/waist/cmd_vel, gz_topic_name: /arm/waist/cmd_vel, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /arm/shoulder/cmd_vel, gz_topic_name: /arm/shoulder/cmd_vel, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /arm/elbow/cmd_vel, gz_topic_name: /arm/elbow/cmd_vel, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /arm/wrist_level/cmd_vel, gz_topic_name: /arm/wrist_level/cmd_vel, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /arm/wrist/cmd_vel, gz_topic_name: /arm/wrist/cmd_vel, ros_type_name: std_msgs/msg/Float64, gz_type_name: gz.msgs.Double, direction: ROS_TO_GZ}
- {ros_topic_name: /suction/attach, gz_topic_name: /suction/attach, ros_type_name: std_msgs/msg/Empty, gz_type_name: gz.msgs.Empty, direction: ROS_TO_GZ}
- {ros_topic_name: /suction/detach, gz_topic_name: /suction/detach, ros_type_name: std_msgs/msg/Empty, gz_type_name: gz.msgs.Empty, direction: ROS_TO_GZ}
- {ros_topic_name: /suction/state, gz_topic_name: /suction/state, ros_type_name: std_msgs/msg/String, gz_type_name: gz.msgs.StringMsg, direction: GZ_TO_ROS}
- {ros_topic_name: /ground_truth/box_pose, gz_topic_name: /model/aruco_box/pose, ros_type_name: geometry_msgs/msg/Pose, gz_type_name: gz.msgs.Pose, direction: GZ_TO_ROS}
